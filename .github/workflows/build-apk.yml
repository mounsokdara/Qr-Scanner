name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK 35
        run: |
          set -euo pipefail
          if ! command -v sdkmanager >/dev/null 2>&1; then
            SM="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
            export PATH="$(dirname "$SM"):$PATH"
          fi
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build unsigned release APK
        run: bash scripts/build-apk.sh

      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Sign + verify APK (apksigner v1/v2/v3/v4)
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          VER=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          mkdir -p dist
          KS_FILE="$RUNNER_TEMP/release.p12" bash scripts/sign-apk.sh \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "dist/com.mounsokdara.qr_scanner.apk"
          rm -f dist/com.mounsokdara.qr_scanner.apk.idsig
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort | tail -1)
          "$AAPT" dump badging dist/com.mounsokdara.qr_scanner.apk | grep -m1 "^package:"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: com.mounsokdara.qr_scanner
          path: dist/com.mounsokdara.qr_scanner.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="${version:-1.0.0}"
          TAG="v$VER"
          NOTES="Signed release of com.mounsokdara.qr_scanner $VER (v1+v2+v3+v4)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/com.mounsokdara.qr_scanner.apk --clobber
          else
            gh release create "$TAG" dist/com.mounsokdara.qr_scanner.apk \
              --title "QR & Barcode Scanner $TAG" \
              --notes "$NOTES" \
              --latest
          fi
