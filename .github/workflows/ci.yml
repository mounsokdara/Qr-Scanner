name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK 35
        run: |
          set -euo pipefail
          if ! command -v sdkmanager >/dev/null 2>&1; then
            SM="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
            export PATH="$(dirname "$SM"):$PATH"
          fi
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Confirm tests actually ran
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = f = e = s = 0
          for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r = ET.parse(p).getroot()
              t += int(r.get('tests')); f += int(r.get('failures'))
              e += int(r.get('errors')); s += int(r.get('skipped'))
          print(f"::notice title=Unit tests::{t} tests, {f} failures, {e} errors, {s} skipped")
          assert t >= 50 and f == 0 and e == 0, "unit tests missing or failing"
          PY

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Lint (report only)
        continue-on-error: true
        run: ./gradlew lintDebug --no-daemon

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
